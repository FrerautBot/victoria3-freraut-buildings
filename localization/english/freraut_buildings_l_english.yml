 # ==========================================
 # CONFEDERATION - Power Bloc
 # ==========================================

 # Identity
 identity_confederation: "Confederation"
 identity_confederation_desc: "A union of sovereign states bound together under a single leader. Members become Confederated States, sharing a common market and coordinated governance. If the confederation dissolves, all confederated members become puppets."

 # Subject Type
 subject_type_confederated_state: "Confederated State"
 subject_type_confederated_state_no_icon: "Confederated State"
 subject_type_confederated_state_desc: "A sovereign nation bound to the Confederation by a solemn pact of unity. Confederated States walk beside their leader as partners — not servants — preserving their flag, their voice, and their people, while sharing a common market, coordinated laws, and a united destiny. Two lands, one purpose: where the bonds of cooperation replace the chains of conquest."

 # Concept
 concept_confederated_state: "Confederated State"
 concept_confederated_state_desc: "A [concept_subject_type] created by the Confederation power bloc identity. Members retain high autonomy, keep their own rulers, and enjoy significant independence — yet stand united under a common economic, political and legislative framework forged by the leader. Should the Confederation dissolve, confederated states fall back into [concept_puppet] status, a reminder that their strength lies in unity."

 # Principle Groups
 principle_group_confederation_industry: "Industrial Integration"
 principle_group_confederation_industry_desc: "Principles focused on industrial cooperation, shared manufacturing capacity, and joint construction projects across the confederation."
 principle_group_confederation_banking: "Confederate Banking"
 principle_group_confederation_banking_desc: "Principles that establish a confederation-wide banking system, channeling wealth to the leader while strengthening financial institutions across all members."
 principle_group_confederation_politics: "Shared Governance"
 principle_group_confederation_politics_desc: "Principles that synchronize political institutions across the confederation, from governance laws to elections and full legislative alignment."

 # Principles - Industrial Integration
 principle_confederation_industry_1: "Industrial Integration"
 principle_confederation_industry_1_desc: "Basic industrial cooperation: member states gain construction efficiency and manufacturing throughput bonuses."
 principle_confederation_industry_2: "Industrial Integration"
 principle_confederation_industry_2_desc: "Advanced integration: improved manufacturing and mining throughput, plus reduced infrastructure usage for construction."
 principle_confederation_industry_3: "Industrial Integration"
 principle_confederation_industry_3_desc: "Full industrial union: maximum throughput bonuses, additional company slots, and enhanced company performance."

 # Principles - Confederate Banking
 principle_confederation_banking_1: "Confederate Banking"
 principle_confederation_banking_1_desc: "Basic financial cooperation: the leader receives tax income from the confederation, and all members gain financial district throughput and infrastructure."
 principle_confederation_banking_2: "Confederate Banking"
 principle_confederation_banking_2_desc: "Expanded banking: increased leader income, higher leverage from economic dependence, reduced nationalization costs, and foreign investment within the bloc."
 principle_confederation_banking_3: "Confederate Banking"
 principle_confederation_banking_3_desc: "Full financial union: maximum leader income, economy of scale bonuses, income transfer to leader, and complete foreign investment rights."

 # Principles - Shared Governance
 principle_confederation_politics_1: "Shared Governance"
 principle_confederation_politics_1_desc: "Basic political alignment: reduced law enactment stalls and minimum legitimacy. The leader can impose governance laws on members."
 principle_confederation_politics_2: "Shared Governance"
 principle_confederation_politics_2_desc: "Government synchronization: when the leader reforms their government, all confederated states adopt the same governance and distribution of power laws."
 principle_confederation_politics_3: "Shared Governance"
 principle_confederation_politics_3_desc: "Full political union: elections are synchronized, all major law groups can be imposed, and wars between members are forbidden."

 # Events
 freraut_confederation.1.a: "They have joined the Confederation"
 freraut_confederation.2.a: "Government synchronized"
 freraut_confederation.3.a: "Elections synchronized"
 freraut_confederation.4.a: "The Confederation has fallen"

 # Diplomatic Action: Confederalize
 confederalize_member: "Confederalize Member"
 confederalize_member_desc: "Immediately integrate this power bloc member as a Confederated State under your leadership. They become your subject with high autonomy, sharing your market and governance."
 confederalize_member_action_name: "Confederalize"
 confederalize_member_tooltip: "This country will become a Confederated State, a high-autonomy subject that follows your governance laws and shares your market."

 # Diplomatic Pact: Confederate (subject relation)
 confederate: "Confederated State"
 confederate_desc: "A confederated subject relationship. The subject retains high autonomy but follows the confederation leader's governance policies."
 confederate_action_name: "Confederalize"
 confederate_tooltip: "This country becomes a Confederated State."
 confederate_breakoff: "Dissolve Confederation"
 confederate_breakoff_desc: "End the confederation relationship with this country."

 # Mining Center - Automation PMG
 pmg_mining_center_automation: "Workforce Systems"
 pm_mining_center_manual_workers: "Workers in the Systems"
 pm_mining_center_manual_workers_desc: "Workers carry out all mining operations manually."
 pm_mining_center_mechanized: "Assisting Mechanisms and Machinery"
 pm_mining_center_mechanized_desc: "Machines now automate and facilitate some processes, reducing the number of workers needed."

 # Manufacturing Center - Automation PMG
 pmg_manufacturing_center_automation: "Production Systems"
 pm_manufacturing_center_manual_crafts: "Manual Craftsmanship"
 pm_manufacturing_center_manual_crafts_desc: "Workers carry out all manufacturing operations by hand."
 pm_manufacturing_center_specialized_tools: "Specialized Tools"
 pm_manufacturing_center_specialized_tools_desc: "New steelworking technologies enable specialized tools that dramatically improve production efficiency, reducing workforce needs while producing a wide variety of goods."

 # Confederate Diplomatic Actions
 da_freraut_change_confederate_language: "Modify Administrative Language"
 da_freraut_change_confederate_language_desc: "Impose the overlord's language on the administration of the confederated state. Bureaucrats will begin speaking the ruler's tongue, but the local population will resist this cultural imposition."
 
 da_freraut_implement_regime: "Implement Regime"
 da_freraut_implement_regime_desc: "Force the confederated state to adopt ALL of the overlord's laws, regardless of its technology. This action is always available — use it whenever you change a law to ensure your confederated partner follows the same legal framework."

