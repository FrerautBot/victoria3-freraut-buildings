 # IDEOLOGICAL PATHS
 # ═══════════════════════════════════════════
 freraut_ideological_category: "Choose Your Ideological Path"
 freraut_ideological_category_desc: "Our nation stands at a historical crossroads. It is time to choose the ideological path that will define our future."

 freraut_path_socialist: "Socialist Path"
 freraut_path_socialist_desc: "Republic of councils: workers' and women's suffrage, factory councils, community administration, cooperative property, progressive taxation, pensions and workers' protection. State atheism, multiculturalism, a revolutionary guard and a militarized police; slavery and dissent are forbidden."

 freraut_path_communist: "Communist Path"
 freraut_path_communist_desc: "Proletarian revolution: abolition of private property and planned economy. Inspired by the USSR."

 freraut_path_presidential: "Presidential Liberal Path"
 freraut_path_presidential_desc: "Presidential republic: separation of powers and free market. Inspired by the USA and French Fifth Republic."

 freraut_path_parliamentary: "Parliamentary Liberal Path"
 freraut_path_parliamentary_desc: "Parliamentary democracy: free market and representative government. Inspired by the Westminster model."

 freraut_path_ancap: "Anarcho-Capitalist Path"
 freraut_path_ancap_desc: "Minimal state: absolute property, deregulated markets. Inspired by Rothbard."

 freraut_path_ancocom: "Anarcho-Communist Path"
 freraut_path_ancocom_desc: "Libertarian communism: popular assemblies and militias. Inspired by the CNT/FAI."

 freraut_path_monarcho_fascist: "Monarcho-Fascist Path"
 freraut_path_monarcho_fascist_desc: "Corporate state under the crown: nationalism and autarky. Inspired by Fascist Italy."

 freraut_path_fascist: "Fascist Path"
 freraut_path_fascist_desc: "Totalitarian state: leader cult, racial purity, expansionism. Inspired by Nazi Germany."

 freraut_path_theocratic: "Theocratic Path"
 freraut_path_theocratic_desc: "Clerical government: divine law as constitution. Inspired by the Papal States."

 freraut_path_feudal: "Feudal Monarchic Path"
 freraut_path_feudal_desc: "Landowning nobility: serfdom and seigneurial economy. Inspired by Tsarist Russia."

 freraut_path_absolutist: "Absolute Monarchy Path"
 freraut_path_absolutist_desc: "The king is the state: absolute centralization. Inspired by Louis XIV."

 freraut_path_democratic_monarchy: "Democratic Monarchy Path"
 freraut_path_democratic_monarchy_desc: "Constitutional monarchy: the king reigns but does not rule. Inspired by Spain 1978."

