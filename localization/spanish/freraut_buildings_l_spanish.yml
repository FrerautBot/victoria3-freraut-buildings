 pmg_logistics_transport: "Método de Transporte"
 pm_logistics_horses: "Uso de Caballos"
 pm_logistics_horses_desc: "El centro de logística usa caballos y carretas para el transporte. Básico pero confiable, aunque no puede optimizar el consumo de insumos."
 pm_logistics_railways: "Tecnología de Rieles"
 pm_logistics_railways_desc: "Con los rieles, el centro de logística puede optimizar toda su cadena de suministro, reduciendo el consumo de insumos en un 50%."

 pm_public_health_quinine: "Tratamiento de Malaria"
 pm_public_health_quinine_desc: "Con tratamientos basados en quinina, el sistema de salud alcanza su máximo potencial: +40% natalidad y -40% mortalidad. Requiere la tecnología Quinina."

 pmg_public_health_medical_techniques: "Técnicas Médicas"
 pm_public_health_18th_century: "Tratamientos del Siglo 18"
 pm_public_health_18th_century_desc: "Tratamientos médicos primitivos de la era preindustrial. Sangrías, remedios herbales y tónicos dudosos — sin efecto medible sobre la salud pública."
 pm_public_health_victorian: "Uso de Jeringas y Nuevos Métodos Victorianos"
 pm_public_health_victorian_desc: "Con la llegada de la titulación médica, las jeringas modernas y las prácticas victorianas científicas, los médicos capacitados transforman la salud pública: +30% de natalidad, -30% de mortalidad y +25% de seguridad alimentaria. Requiere menos personal gracias a la especialización médica (-1000 burócratas, -1500 obreros). Requiere la tecnología Titulación de Medicina."

 pmg_bank_financial_services: "Servicios Financieros"
 pm_bank_no_financial_services: "Sin Servicios Financieros"
 pm_bank_no_financial_services_desc: "El Banco Central opera sin servicios financieros. Sin consumo adicional de servicios ni producción extra de oro."
 pm_bank_financial_services: "Servicios Financieros"
 pm_bank_financial_services_desc: "El Banco Central ofrece servicios financieros a la economía, consumiendo 30 de servicios y produciendo 60 de oro."

 bg_fertilization_center: "Centro de Fertilización"
 building_fertilization_center: "Centro de Fertilización"
 building_fertilization_center_desc: "Un centro agrícola estatal que produce grandes cantidades de cultivos y bienes de plantación: opio, seda, licor, trigo, frutas, tabaco, azúcar, té, café, algodón, caucho y tinte. Solo disponible para el jugador."
 pmg_fertilization_base: "Método de Producción"
 pmg_fertilization_chemicals: "Fertilizantes Químicos"
 pm_fertilization_base: "Agricultura Tradicional"
 pm_fertilization_base_desc: "El centro produce 100 unidades de cada bien agrícola usando métodos de agricultura tradicional."
 pm_fertilization_railways: "Uso de Rieles"
 pm_fertilization_railways_desc: "Los rieles permiten una distribución eficiente, aumentando la producción a 150 unidades de cada bien. Consume 30 de transporte. Requiere la tecnología Ferrocarril."
 pm_fertilization_no_fertilizer: "Sin Fertilizante"
 pm_fertilization_no_fertilizer_desc: "Aún no se dispone de fertilizantes químicos. Investiga Agricultura Intensiva para desbloquear su uso."
 pm_fertilization_with_fertilizer: "Uso de Fertilizantes"
 pm_fertilization_with_fertilizer_desc: "Los fertilizantes químicos aumentan la producción en 100 unidades adicionales de cada bien. Consume 30 de fertilizante, 30 de hierro, 30 de azufre y 30 de carbón. Requiere la tecnología Agricultura Intensiva."

 corporate_financial_services: "Servicios Financieros Corporativos"
 corporate_financial_services_desc: "Instrumentos financieros premium, bonos corporativos y portafolios de inversión gestionados por las grandes instituciones bancarias de la nación."
 modifier_goods_output_corporate_financial_services_add: "@corporate_financial_services! Producción de Servicios Financieros Corporativos por nivel"
 modifier_goods_output_corporate_financial_services_add_desc: "La cantidad de @corporate_financial_services! Servicios Financieros Corporativos producidos por los edificios"
 modifier_goods_input_corporate_financial_services_add: "@corporate_financial_services! Consumo de Servicios Financieros Corporativos por nivel"
 modifier_goods_input_corporate_financial_services_add_desc: "La cantidad de @corporate_financial_services! Servicios Financieros Corporativos consumidos por los edificios"
 bg_grand_company_bank: "Banco de la Gran Compañía"
 building_grand_company_bank: "Banco de la Gran Compañía"
 building_grand_company_bank_desc: "Una prestigiosa institución bancaria que provee servicios financieros corporativos y genera oro. Solo la compañía del Banco Nacional puede construir y expandir este edificio. La sede de la compañía se puede comprar, vender, expropiar o destruir como cualquier edificio normal."
 pmg_grand_company_bank_operations: "Operaciones Bancarias"
 pm_grand_company_bank_base: "Banca Corporativa"
 pm_grand_company_bank_base_desc: "El banco provee servicios financieros corporativos, consumiendo 20 de servicios y produciendo 70 de oro más 40 de Servicios Financieros Corporativos."
 company_freraut_national_bank: "Banco de [country|v]"
 company_freraut_national_bank_desc: "La institución bancaria principal de la nación, establecida por decreto para impulsar el crecimiento industrial y la expansión financiera."
 je_freraut_national_industry: "Armar Industria Nacional"
 je_freraut_national_industry_desc: "Con nuestra Bolsa de Valores operativa, tenemos la oportunidad de establecer una institución bancaria nacional que será la piedra angular de nuestras ambiciones industriales. Haz clic en el botón para fundar el Banco Nacional, que construirá 5 niveles de Bancos de la Gran Compañía en la capital y aumentará el máximo de compañías en 20."
 je_freraut_national_industry_complete_desc: "El Banco Nacional ha sido establecido. Nuestras ambiciones industriales ahora están respaldadas por toda la fuerza de nuestro sector financiero."
 je_freraut_national_industry_pending_desc: "La Bolsa de Valores espera tu decisión. Funda el Banco Nacional para desbloquear 20 slots de compañías y comenzar la expansión corporativa."
 freraut_establish_national_bank_name: "Fundar Banco Nacional"
 freraut_establish_national_bank_desc: "Establece el Banco Nacional en nuestra capital. Esto construirá 5 Bancos de la Gran Compañía, aumentará el máximo de compañías en 20 y registrará la compañía. Luego podrás otorgarle charters de Comercio, Inversión y Monopolio para expandir su poder."
 freraut_national_industry_modifier: "Programa de Industria Nacional"
 je_group_freraut: "Proyectos Nacionales Freraut"
 je_freraut_national_industry_reason: "Con nuestra Bolsa de Valores operativa, tenemos la oportunidad de establecer una institución bancaria nacional que será la piedra angular de nuestras ambiciones industriales."
 freraut_establish_national_bank_decision: "Fundar el Banco Nacional"
 freraut_establish_national_bank_decision_desc: "Establece el Banco Nacional en nuestra capital. Esto construirá 5 Bancos de la Gran Compañía, aumentará el máximo de compañías en 20 y registrará la compañía. Luego podrás otorgarle charters de Comercio, Inversión y Monopolio para expandir su poder. Requiere una Bolsa de Valores."
 freraut_establish_national_bank_decision_tooltip: "Funda el Banco Nacional y construye 5 Bancos de la Gran Compañía en la capital."
 bg_industrial_trains: "Trenes Industriales"
 building_industrial_trains: "Trenes Industriales"
 building_industrial_trains_desc: "Una instalacion ferroviaria que consume carbon, hierro y motores para producir cantidades masivas de transporte. Requiere la tecnologia Ferrocarril. Solo disponible para el jugador."
 pmg_industrial_trains_operations: "Operaciones Ferroviarias"
 pm_industrial_trains_base: "Transporte Ferroviario Industrial"
 pm_industrial_trains_base_desc: "Operaciones ferroviarias a escala industrial que consumen carbon, hierro y motores para producir 60 de transporte por nivel."
 bg_breeding_center: "Centro de Criadero"
 building_breeding_center: "Centro de Criadero"
 building_breeding_center_desc: "Un centro estatal de cria y produccion que produce fertilizante, carne, tela y petroleo sin consumir ningun insumo. Solo disponible para el jugador."
 pmg_breeding_center_operations: "Operaciones del Criadero"
 pm_breeding_center_base: "Cria Intensiva"
 pm_breeding_center_base_desc: "Operaciones de cria a gran escala que producen 60 de fertilizante, 80 de carne, 60 de tela y 50 de petroleo por nivel sin requerir insumos."

 # ==========================================
 # CONFEDERACIÓN - Bloque de Poder
 # ==========================================

 # Identidad
 identity_confederation: "Confederación"
 identity_confederation_desc: "Una unión de estados soberanos unidos bajo un solo líder. Los miembros se convierten en Estados Confederados, compartiendo un mercado común y una gobernanza coordinada. Si la confederación se disuelve, todos los confederados se convierten en títeres."

 # Tipo de Sujeto
 subject_type_confederated_state: "Estado Confederado"
 subject_type_confederated_state_no_icon: "Estado Confederado"
 subject_type_confederated_state_desc: "Una nación soberana unida a la Confederación por un pacto solemne de unidad. Los Estados Confederados caminan junto a su líder como socios — no como súbditos — conservando su bandera, su voz y su pueblo, mientras comparten un mercado común, leyes coordinadas y un destino unido. Dos territorios, un mismo propósito: donde los lazos de la cooperación sustituyen a las cadenas de la conquista."

 # Concepto
 concept_confederated_state: "Estado Confederado"
 concept_confederated_state_desc: "Un [concept_subject_type] creado por la identidad de bloque de poder Confederación. Sus miembros conservan alta autonomía, mantienen a sus propios gobernantes y disfrutan de independencia significativa — pero permanecen unidos bajo un marco económico, político y legislativo común forjado por el líder. Si la Confederación se disuelve, los estados confederados regresan al estatus de [concept_puppet], un recordatorio de que su fortaleza reside en la unión."

 # Grupos de Principios
 principle_group_confederation_industry: "Integración Industrial"
 principle_group_confederation_industry_desc: "Principios enfocados en la cooperación industrial, capacidad manufacturera compartida y proyectos de construcción conjuntos en toda la confederación."
 principle_group_confederation_banking: "Banca Confederada"
 principle_group_confederation_banking_desc: "Principios que establecen un sistema bancario confederado, canalizando riqueza al líder mientras fortalecen las instituciones financieras de todos los miembros."
 principle_group_confederation_politics: "Política Compartida"
 principle_group_confederation_politics_desc: "Principios que sincronizan las instituciones políticas de la confederación, desde leyes de gobernanza hasta elecciones y alineación legislativa completa."

 # Principios - Integración Industrial
 principle_confederation_industry_1: "Integración Industrial"
 principle_confederation_industry_1_desc: "Cooperación industrial básica: los estados miembros obtienen bonificaciones de eficiencia de construcción y rendimiento manufacturero."
 principle_confederation_industry_2: "Integración Industrial"
 principle_confederation_industry_2_desc: "Integración avanzada: mejor rendimiento manufacturero y minero, además de menor uso de infraestructura para construcción."
 principle_confederation_industry_3: "Integración Industrial"
 principle_confederation_industry_3_desc: "Unión industrial completa: máximas bonificaciones de rendimiento, ranuras adicionales de compañías y mejor desempeño empresarial."

 # Principios - Banca Confederada
 principle_confederation_banking_1: "Banca Confederada"
 principle_confederation_banking_1_desc: "Cooperación financiera básica: el líder recibe ingresos fiscales de la confederación y todos los miembros obtienen rendimiento del distrito financiero e infraestructura."
 principle_confederation_banking_2: "Banca Confederada"
 principle_confederation_banking_2_desc: "Banca expandida: mayor ingreso al líder, mayor influencia por dependencia económica, costos de nacionalización reducidos e inversión extranjera dentro del bloque."
 principle_confederation_banking_3: "Banca Confederada"
 principle_confederation_banking_3_desc: "Unión financiera completa: máximo ingreso al líder, bonificaciones de economías de escala, transferencia de ingresos al líder y derechos completos de inversión extranjera."

 # Principios - Política Compartida
 principle_confederation_politics_1: "Política Compartida"
 principle_confederation_politics_1_desc: "Alineación política básica: menos estancamientos en promulgación de leyes y legitimidad mínima. El líder puede imponer leyes de gobernanza a los miembros."
 principle_confederation_politics_2: "Política Compartida"
 principle_confederation_politics_2_desc: "Sincronización de gobierno: cuando el líder reforma su gobierno, todos los estados confederados adoptan las mismas leyes de gobernanza y distribución de poder."
 principle_confederation_politics_3: "Política Compartida"
 principle_confederation_politics_3_desc: "Unión política completa: las elecciones se sincronizan, todos los grupos de leyes principales pueden ser impuestos y las guerras entre miembros están prohibidas."

