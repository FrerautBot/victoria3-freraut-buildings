 pm_public_health_base_desc: "Un programa integral de salud que mejora drásticamente el crecimiento de la población."
 bg_mining_center: "Centro de Minas"
 building_mining_center: "Centro de Minas"
 building_mining_center_desc: "Una operación minera masiva e integrada que extrae todos los recursos minerales. Solo disponible para el jugador."
 pmg_mining_center_operations: "Operaciones del Centro de Minas"
 pm_mining_center_base: "Extracción Multi-Recurso"
 pm_mining_center_base_desc: "Una operación minera integrada que extrae azufre, hierro, plomo, oro y carbón."
 bg_manufacturing_center: "Centro de Manufactura"
 building_manufacturing_center: "Centro de Manufactura"
 building_manufacturing_center_desc: "Una fábrica integral que produce todo bien manufacturado imaginable. Solo disponible para el jugador."
 pmg_manufacturing_center_operations: "Operaciones del Centro de Manufactura"
 pm_manufacturing_center_base: "Producción Total Frerautiana"
 pm_manufacturing_center_base_desc: "Un método de manufactura total que transforma materias primas en todo producto concebible."
 bg_public_works: "Obras Públicas"
 building_public_works: "Obras Públicas"
 building_public_works_desc: "Una agencia gubernamental de construcción que proporciona capacidad de construcción masiva, servicios e innovación. Solo disponible para el jugador."
 pmg_public_works_operations: "Operaciones de Obras Públicas"
 pm_public_works_base: "Programa de Construcción Estatal"
 pm_public_works_base_desc: "Un programa de construcción estatal que construye infraestructura a velocidad increíble mientras impulsa la innovación."
 bg_sovereign_palace: "Palacio Soberano"
 building_sovereign_palace: "Palacio Soberano"
 building_sovereign_palace_desc: "La sede del poder absoluto. Otorga bonificaciones masivas a la autoridad, burocracia, diplomacia, legitimidad, rendimiento de edificios y capacidad de influir en movimientos políticos. Solo disponible para el jugador."
 pmg_sovereign_palace_operations: "Operaciones del Palacio"
 pm_sovereign_palace_base: "Gobierno Soberano"
 pm_sovereign_palace_base_desc: "El palacio ejerce control absoluto sobre la nación, amplificando cada aspecto de la gobernanza y aplastando o potenciando movimientos políticos a voluntad."
 bg_tech_university: "Universidad Tecnológica"
 building_tech_university: "Universidad Tecnológica"
 building_tech_university_desc: "Una universidad tecnológica avanzada que forma trabajadores altamente cualificados, produce académicos, impulsa la innovación y genera ingresos fiscales. Solo disponible para el jugador."
 pmg_tech_university_operations: "Operaciones Universitarias"
 pm_tech_university_base: "Investigación Tecnológica Avanzada"
 pm_tech_university_base_desc: "Un programa de investigación y educación de vanguardia que aumenta masivamente la cualificación, la innovación, y genera impuesto a la renta."
 bg_national_trade: "Centro de Bienes Nacionales de Intercambio"
 building_national_trade: "Centro de Bienes Nacionales de Intercambio"
 building_national_trade_desc: "Un centro nacional de comercio que permite operaciones masivas de importación y exportación con 300 de capacidad comercial por nivel. Solo disponible para el jugador."
 pmg_national_trade_operations: "Operaciones del Centro de Intercambio"
 pm_national_trade_base: "Programa de Comercio Nacional"
 pm_national_trade_base_desc: "Un programa de comercio respaldado por el estado que amplía enormemente la capacidad y rutas comerciales, permitiendo volúmenes enormes de importación/exportación a costo mínimo."
 bg_logistics_center: "Centro de Logística"
 building_logistics_center: "Centro de Logística"
 building_logistics_center_desc: "Un centro logístico masivo que consume todo tipo de bienes para generar demanda, produce servicios y oro, mejora la seguridad alimentaria y la natalidad. Solo disponible para el jugador."
 pmg_logistics_center_operations: "Operaciones Logísticas"
 pm_logistics_center_base: "Red Logística Nacional"
 pm_logistics_center_base_desc: "Una red logística integral que consume grandes cantidades de bienes para sostener la demanda, mientras provee servicios, oro, seguridad alimentaria y mejores condiciones de vida."
 bg_national_academy: "Academia Nacional Militar"
 building_national_academy: "Academia Nacional Militar"
 building_national_academy_desc: "Una academia militar de élite que amplía la capacidad del ejército, mejora la efectividad en combate y acelera la investigación militar. Solo disponible para el jugador."
 pmg_national_academy_operations: "Operaciones de la Academia"
 pm_national_academy_base: "Entrenamiento Militar de Élite"
 pm_national_academy_base_desc: "Un programa de entrenamiento de élite que permite expansión masiva del ejército (+100 niveles de cuarteles y conscripción), mejora ataque y defensa, aumenta las bajas infligidas y duplica la velocidad de investigación militar."

 bg_stock_exchange: "Bolsa de Valores"
 building_stock_exchange: "Bolsa de Valores"
 building_stock_exchange_desc: "Una bolsa de valores nacional que potencia masivamente la inversión de todos los grupos sociales y reduce costos de insumos. Cuenta con dos modos operativos y políticas de inversión extranjera. Solo disponible para el jugador."
 pmg_stock_exchange_model: "Modelo de la Bolsa"
 pm_stock_exchange_national: "Bolsa de Valores Nacional"
 pm_stock_exchange_national_desc: "Una bolsa de valores doméstica que aumenta la eficiencia del fondo de inversión en un 500% para todos los grupos sociales (capitalistas, tenderos, aristócratas, granjeros, clérigos) y reduce los costos de insumos un 25%."
 pm_stock_exchange_international: "Modelo Internacional"
 pm_stock_exchange_international_desc: "Un modelo de bolsa internacional con el mismo 500% de impulso a la inversión, más +500 Influencia, +200 Maniobras Diplomáticas, +100 Amenabilidad, +100 Reputación Diplomática y +200% Velocidad de Mejora de Relaciones. Hace que otros países acepten mucho más fácilmente tus propuestas de tratados, incluyendo derechos de inversión."
 pmg_stock_exchange_foreign_policy: "Política de Inversión Extranjera"
 pm_stock_exchange_no_foreign: "No Permitir Inversión Extranjera"
 pm_stock_exchange_no_foreign_desc: "La inversión extranjera está restringida. Solo los países con tratados de derechos de inversión activos pueden invertir en tus empresas."
 pm_stock_exchange_allow_foreign: "Permitir Inversión Extranjera"
 pm_stock_exchange_allow_foreign_desc: "Abre las puertas a todos los inversores extranjeros. Todos los grupos sociales contribuyen capital extra, atrayendo inversión extranjera masiva sin importar tratados."

 bg_dissident_agency: "Agencia de Disidentes"
 building_dissident_agency: "Agencia de Disidentes"
 building_dissident_agency_desc: "Una agencia gubernamental encubierta con detectives armados y operativos de inteligencia que vigilan, potencian o suprimen facciones políticas. Requiere leyes de censura, gobierno autocrático o policía secreta. Solo disponible para el jugador."
 pmg_dissident_agency_base: "Operaciones de la Agencia"
 pm_dissident_agency_base: "Operaciones de Inteligencia"
 pm_dissident_agency_base_desc: "La agencia realiza operaciones de inteligencia, otorgando +100 de Autoridad y +100 de Burocracia. Los agentes consumen papel para informes, armas para operaciones de campo y tabaco para... la moral."
