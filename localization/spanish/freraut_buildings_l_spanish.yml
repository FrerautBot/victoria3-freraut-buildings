 pmg_central_bank_operations: "Operaciones del Banco Central"
 pm_central_bank_base: "Acuñación Nacional"
 pm_central_bank_base_desc: "Una operación estatal de acuñación que produce oro y aumenta la tasa de acuñación de la nación."
 bg_public_health: "Salud Pública"
