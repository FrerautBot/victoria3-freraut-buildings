 # Acción Diplomática: Confederalizar
 confederalize_member: "Confederalizar Miembro"
 confederalize_member_desc: "Integrar inmediatamente a este miembro del bloque de poder como Estado Confederado bajo tu liderazgo. Se convierte en tu sujeto con alta autonomía, compartiendo tu mercado y gobernanza."
 confederalize_member_action_name: "Confederalizar"
 confederalize_member_tooltip: "Este país se convertirá en un Estado Confederado, un sujeto de alta autonomía que sigue tus leyes de gobernanza y comparte tu mercado."

 # Pacto Diplomático: Confederate (relación de sujeto)
 confederate: "Estado Confederado"
 confederate_desc: "Una relación de sujeto confederado. El sujeto mantiene alta autonomía pero sigue las políticas de gobierno del líder de la confederación."
 confederate_action_name: "Confederalizar"
 confederate_tooltip: "Este país se convierte en un Estado Confederado."
 confederate_breakoff: "Disolver Confederación"
 confederate_breakoff_desc: "Terminar la relación de confederación con este país."

 # Centro Minero - PMG Automatización
 pmg_mining_center_automation: "Sistemas de la Fuerza Laboral"
 pm_mining_center_manual_workers: "Obreros en los Sistemas"
 pm_mining_center_manual_workers_desc: "Los obreros realizan todas las operaciones mineras de forma manual."
 pm_mining_center_mechanized: "Mecanismos y Maquinarias Asistentes"
 pm_mining_center_mechanized_desc: "Las máquinas ahora automatizan y facilitan algunos procesos, reduciendo la cantidad de obreros necesarios."

 # Centro de Manufactura - PMG Automatización
 pmg_manufacturing_center_automation: "Sistemas de Producción"
 pm_manufacturing_center_manual_crafts: "Manualidades Obreras"
 pm_manufacturing_center_manual_crafts_desc: "Los obreros realizan todas las operaciones de manufactura a mano."
 pm_manufacturing_center_specialized_tools: "Herramientas Especializadas"
 pm_manufacturing_center_specialized_tools_desc: "Las nuevas tecnologías siderúrgicas permiten herramientas especializadas que mejoran drásticamente la eficiencia productiva, reduciendo la fuerza laboral necesaria mientras se produce una amplia variedad de bienes."

 # Acciones Diplomaticas del Estado Confederado
 da_freraut_change_confederate_language: "Modificar Lengua de la Administración"
 da_freraut_change_confederate_language_desc: "Imponer el idioma del soberano en la administración del estado confederado. Los burócratas comenzarán a hablar la lengua del gobernante, pero la población local resistirá esta imposición cultural."

 da_freraut_implement_regime: "Implementación de Régimen"
 da_freraut_implement_regime_desc: "Obliga al estado confederado a adoptar TODAS las leyes del soberano, sin importar su nivel tecnológico. Esta acción siempre está disponible — úsala cada vez que cambies una ley para asegurar que tu socio confederado siga el mismo marco legal."

 # ═══════════════════════════════════════════
 # CAMINOS IDEOLÓGICOS
 # ═══════════════════════════════════════════
 freraut_ideological_category: "Elegir el Camino Ideológico"
 freraut_ideological_category_desc: "Nuestra nación se encuentra en una encrucijada histórica. Es momento de elegir el camino ideológico que definirá nuestro futuro."

 freraut_path_socialist: "Camino Socialista"
 freraut_path_socialist_desc: "República de consejos: sufragio obrero y femenino, consejos de fábricas, administración comunitaria, propiedad cooperativa, tributación progresiva, pensiones y protección de los trabajadores. Ateísmo de Estado, multiculturalismo, guardia revolucionaria y policía militarizada; la esclavitud y la disidencia están prohibidas."

 freraut_path_communist: "Camino Comunista"
 freraut_path_communist_desc: "Revolución proletaria: abolición de la propiedad privada y economía planificada. Inspirado en la URSS."

 freraut_path_presidential: "Camino Liberal Republicano Presidencial"
 freraut_path_presidential_desc: "República presidencialista: separación de poderes y libre mercado. Inspirado en EE.UU. y la V República Francesa."

 freraut_path_parliamentary: "Camino Liberal Parlamentario"
 freraut_path_parliamentary_desc: "Democracia parlamentaria: libre mercado y gobierno representativo. Inspirado en el modelo Westminster."

 freraut_path_ancap: "Camino Anarcocapitalista"
 freraut_path_ancap_desc: "Estado mínimo: propiedad absoluta, mercados desregulados. Inspirado en Rothbard."

 freraut_path_ancocom: "Camino Anarcocomunista"
 freraut_path_ancocom_desc: "Comunismo libertario: asambleas populares y milicias. Inspirado en la CNT/FAI."

 freraut_path_monarcho_fascist: "Camino Fascista Monarquista"
 freraut_path_monarcho_fascist_desc: "Estado corporativo bajo la corona: nacionalismo y autarquía. Inspirado en la Italia fascista."

 freraut_path_fascist: "Camino Fascista"
 freraut_path_fascist_desc: "Estado totalitario: culto al líder, pureza racial, expansionismo. Inspirado en la Alemania Nazi."

 freraut_path_theocratic: "Camino Teocrático"
 freraut_path_theocratic_desc: "Gobierno clerical: ley divina como constitución. Inspirado en los Estados Pontificios."

 freraut_path_feudal: "Camino Monárquico Feudal"
 freraut_path_feudal_desc: "Nobleza terrateniente: servidumbre y economía señorial. Inspirado en la Rusia zarista."

 freraut_path_absolutist: "Camino Monárquico Absoluto"
 freraut_path_absolutist_desc: "El rey es el estado: centralización absoluta. Inspirado en Luis XIV."

 freraut_path_democratic_monarchy: "Camino de la Monarquía Democrática"
 freraut_path_democratic_monarchy_desc: "Monarquía constitucional: el rey reina pero no gobierna. Inspirado en España 1978."

